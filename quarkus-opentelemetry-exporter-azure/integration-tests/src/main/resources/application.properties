# Setting these for tests explicitly. Not required in normal application
quarkus.application.name=opentelemetry-exporter-azure-integration-test
quarkus.application.version=999-SNAPSHOT

# The test ingestion endpoint (WireMock) is started by AzureIngestionResource on this port before the application.
applicationinsights.connection.string=InstrumentationKey=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx;IngestionEndpoint=http://127.0.0.1:53602/export

quarkus.otel.logs.enabled=true

quarkus.otel.metrics.enabled=true
# Keep in sync with AzureTest.METRIC_EXPORT_INTERVAL
quarkus.otel.metric.export.interval=2s
quarkus.otel.instrument.jvm-metrics=false
quarkus.otel.bsp.schedule.delay=1s
